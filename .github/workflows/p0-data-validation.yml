# P0: ItemMetadata(샤딩)·Addressables 주소·Codex 본문(.txt) 일관성 검사 (EditMode 테스트)
#
# [보류] GitHub에서 Unity(game-ci)를 돌리려면 UNITY_LICENSE 등 Secrets가 필요합니다.
# 당분간은 로컬에서만 검증하세요: Tools → ARCHÉ → Release, 또는 Tools\Run-P0ValidateOnly.ps1
#
# 나중에 CI를 다시 켤 때:
#   - Personal: https://game.ci/docs/github/activation (UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD)
#   - 아래 on: 에 pull_request 블록을 다시 추가하면 PR마다 자동 실행 가능

name: P0 Data Validation

on:
  # 수동 실행만 (Actions 탭 → 이 워크플로 → Run workflow). Secrets 준비 후 사용.
  workflow_dispatch:

jobs:
  editmode-tests:
    name: EditMode (P0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.10f1
          projectPath: ArchE
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
